[package]
name = "mbwatch"
version = "0.1.0"
edition = "2021"
description = "Headless FFXIV Market Board CLI & daemon powered by Universalis"
license = "MIT"

[lib]
name = "mbwatch"
path = "src/lib.rs"

[[bin]]
name = "mbwatch"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
comfy-table = "7"
owo-colors = "4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
wiremock = "0.6"

[profile.release]
lto = true
strip = true
codegen-units = 1
